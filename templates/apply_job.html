
{% extends 'base.html' %}

{% block title %}
    Apply for Job
{% endblock %}

{% block body %}

    <div class="container apply-container">

        <div class="card shadow p-4 mx-auto apply-card">

            <h3 class="text-center text-primary">
                Apply for Job
            </h3>

            <hr>

            <h5>{{ job.title }}</h5>
            <p>{{ job.company }}</p>
            <p>{{ job.location }}</p>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <!-- Resume -->
                <div class="mb-3">

                    <label class="form-label">
                        Upload Resume
                    </label>

                    {{ form.resume }}

                    {% if form.resume.errors %}
                        <div class="text-danger">
                            {{ form.resume.errors }}
                        </div>
                    {% endif %}

                </div>
                <button type="submit"
                        class="btn btn-success w-100">
                    Submit Application
                </button>

            </form>

        </div>

    </div>

{% endblock %}
