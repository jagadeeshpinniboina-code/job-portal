<!DOCTYPE html>
<html lang="en">
<head>
    <title>
        {% block title %}

        {% endblock %}
    </title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .login-container {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: orange;
            padding: 30px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        .login-card h2 {
            text-align: center;
            font-weight: bold;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .login-card .form-control {
            height: 45px;
            border-radius: 8px;
        }

        .login-card .btn {
            height: 45px;
            border-radius: 8px;
            font-weight: 600;
        }



        .register-container {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            padding: 40px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .register-card h2 {
            text-align: center;
            color: #172554;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .register-subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .register-card .form-label {
            display: block;
            color: #334155;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .register-card input,
        .register-card select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        .register-card input:focus,
        .register-card select:focus {
            border-color: #198754;
            box-shadow: 0 0 0 3px rgba(25,135,84,0.12);
        }

        .register-card .form-text {
            color: #64748b;
            font-size: 12px;
            margin-top: 8px;
        }

        .register-card ul {
            padding-left: 20px;
            margin-top: 8px;
        }

        .register-card ul li {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .register-card .btn {
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            margin-top: 10px;
        }

        .register-card .btn:hover {
            background-color: #146c43;
            transform: translateY(-2px);
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            margin-bottom: 0;
            color: #64748b;
        }

        .login-link a {
            color: #198754;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Mobile Responsive */

        @media (max-width: 576px) {
            .register-card {
                padding: 25px 18px;
            }

            .register-container {
                padding: 20px 12px;
            }
        }
        #create_form{
            margin-bottom: 100px;
            margin-top: 100px;
            background-color: greenyellow;
            padding:30px;
            border: 5px dashed red;

        }
        #create_form label{
            color:red;
            font-weight: bold;
            font-size: 20px;
        }

        /* Job table */

        .job-table {
            width: 100%;
            min-width: 1250px;
            table-layout: fixed;
            font-size: 14px;
        }

        /* Table cells */

        .job-table th,
        .job-table td {
            padding: 12px;
            text-align: left;
            vertical-align: middle;
            overflow-wrap: anywhere;
        }

        /* Column widths */

        .job-table th:nth-child(1) { width: 4%; }
        .job-table th:nth-child(2) { width: 10%; }
        .job-table th:nth-child(3) { width: 9%; }
        .job-table th:nth-child(4) { width: 8%; }
        .job-table th:nth-child(5) { width: 10%; }
        .job-table th:nth-child(6) { width: 11%; }
        .job-table th:nth-child(7) { width: 8%; }
        .job-table th:nth-child(8) { width: 10%; }
        .job-table th:nth-child(9) { width: 24%; }
        .job-table th:nth-child(10) { width: 6%; }

        /* Description scroll */

        .job-description {
            max-height: 180px;
            overflow-y: auto;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        /* Apply button */

        .job-table .btn {
            white-space: nowrap;
        }

        /* Responsive screen */

        @media (max-width: 768px) {

            .job-table {
                min-width: 1250px;
                font-size: 13px;
            }

            .job-table th,
            .job-table td {
                padding: 8px;
            }

        }
        /* Move jobs content below fixed navbar */

        .apply-container {
            padding-top: 40px;
            padding-bottom: 40px;
        }

        .apply-card {
            max-width: 650px;
            width: 100%;
            border-radius: 12px;
        }

        .apply-card input,
        .apply-card textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
        }

        .apply-card textarea {
            min-height: 150px;
        }


    </style>

</head>
<body>
{% include 'manubar.html' %}

<div class="container-fluid mt-3">

    {% block body %}

    {% endblock %}
</div>

</body>
</html>
